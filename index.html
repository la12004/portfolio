<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lama Al Shahri</title>
<meta name="description" content="Portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // اللغة الافتراضية: "en" إنجليزي أو "ar" عربي (بعدها يتذكر اختيار الزائر)
  (function(){
    var DEFAULT = "en", l = DEFAULT;
    try { l = localStorage.getItem("lang") || DEFAULT; } catch(e){}
    var d = document.documentElement;
    d.lang = l; d.dir = l === "ar" ? "rtl" : "ltr";
    document.write('<link id="bsCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap' + (l === "ar" ? ".rtl" : "") + '.min.css" rel="stylesheet">');
  })();
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-bs-spy="scroll" data-bs-target="#mainNav" data-bs-offset="110">

<nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
  <div class="container">
    <a class="navbar-brand" href="#home" id="brand"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav mx-lg-auto mb-3 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="#about" data-i18n="nav_about"></a></li>
        <li class="nav-item"><a class="nav-link" href="#skills" data-i18n="nav_skills"></a></li>
        <li class="nav-item"><a class="nav-link" href="#projects" data-i18n="nav_projects"></a></li>
        <li class="nav-item"><a class="nav-link" href="#experience" data-i18n="nav_experience"></a></li>
        <li class="nav-item"><a class="nav-link" href="#education" data-i18n="nav_education"></a></li>
        <li class="nav-item"><a class="nav-link" href="#certifications" data-i18n="nav_certs"></a></li>
        <li class="nav-item"><a class="nav-link" href="#recommendations" data-i18n="nav_recs"></a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <button class="lang-pill" id="langBtn" type="button" aria-label="Language"><i class="bi bi-translate"></i><span data-l="en">EN</span><em>/</em><span data-l="ar">AR</span></button>
        <a class="nav-cta" href="#contact" data-i18n="nav_contact"></a>
      </div>
    </div>
  </div>
</nav>

<header id="home" class="hero">
  <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="grid-bg"></span>
  <div class="container position-relative">
    <div class="row align-items-center g-5">
      <div class="col-lg-7">
        <span class="hello-chip"><span class="dot"></span><span data-i18n="hello"></span></span>
        <h1 id="heroName"></h1>
        <div class="role-chips" id="heroRole"></div>
        <p class="hero-desc" id="heroTag"></p>
        <div class="d-flex flex-wrap gap-3">
          <a href="#projects" class="btn-x btn-sky"><span data-i18n="hero_cta1"></span> <i class="bi bi-arrow-right arrow"></i></a>
          <a href="#contact" class="btn-x btn-glass"><i class="bi bi-envelope"></i> <span data-i18n="hero_cta2"></span></a>
        </div>
      </div>
      <div class="col-lg-5 d-flex justify-content-center" id="heroPhoto"></div>
    </div>
    <div class="row g-3 hl-row" id="highlights"></div>
  </div>
</header>

<section id="about" class="sec">
  <div class="container">
    <div class="sec-head reveal"><h2 data-i18n="nav_about_title"></h2><p data-i18n="about_sub"></p></div>
    <div class="row g-4 align-items-center">
      <div class="col-lg-6 reveal"><div class="about-card" id="aboutText"></div></div>
      <div class="col-lg-6"><div class="points" id="aboutPoints"></div></div>
    </div>
  </div>
</section>

<section id="skills" class="sec sec-alt">
  <div class="container">
    <div class="sec-head reveal"><h2 data-i18n="nav_skills"></h2><p data-i18n="skills_sub"></p></div>
    <div class="row g-4" id="skillsList"></div>
  </div>
</section>

<section id="projects" class="sec">
  <div class="container">
    <div class="sec-head reveal"><h2 data-i18n="nav_projects"></h2><p data-i18n="projects_sub"></p></div>
    <div class="row g-4" id="projectsList"></div>
  </div>
</section>

<section id="experience" class="sec sec-alt">
  <div class="container">
    <div class="sec-head reveal"><h2 data-i18n="nav_experience"></h2><p data-i18n="exp_sub"></p></div>
    <div class="tl" id="experienceList"></div>
  </div>
</section>

<section id="education" class="sec">
  <div class="container">
    <div class="sec-head reveal"><h2 data-i18n="nav_education"></h2><p data-i18n="edu_sub"></p></div>
    <div id="educationList"></div>
  </div>
</section>

<section id="certifications" class="sec sec-alt">
  <div class="container">
    <div class="sec-head reveal"><h2 data-i18n="certs_title"></h2><p data-i18n="certs_sub"></p></div>
    <div class="filters reveal" id="certFilters"></div>
    <div class="row g-4" id="certList"></div>
    <div id="extraBlock" class="mt-5"></div>
  </div>
</section>

<section id="recommendations" class="sec">
  <div class="container">
    <div class="sec-head reveal"><h2 data-i18n="recs_title"></h2><p data-i18n="recs_sub"></p></div>
    <div class="row g-4 justify-content-center" id="recList"></div>
  </div>
</section>

<section id="contact" class="sec sec-contact">
  <div class="container">
    <div class="sec-head reveal"><h2 data-i18n="contact_title"></h2><p id="contactIntro"></p></div>
    <div class="contact-wrap reveal">
      <aside class="contact-side">
        <h3 data-i18n="contact_side"></h3>
        <div class="contact-items" id="contactList"></div>
      </aside>

      <form class="contact-form needs-validation" id="contactForm" name="contact" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" novalidate>
        <input type="hidden" name="form-name" value="contact">
        <p class="d-none"><label>Don't fill this out: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="fName" data-i18n="f_name"></label>
            <input class="form-control" id="fName" name="name" type="text" required autocomplete="name" maxlength="80">
            <div class="invalid-feedback" data-i18n="f_req"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="fEmail" data-i18n="f_email"></label>
            <input class="form-control" id="fEmail" name="email" type="email" required autocomplete="email" maxlength="120" dir="ltr">
            <div class="invalid-feedback" data-i18n="f_email_bad"></div>
          </div>
          <div class="col-12">
            <label class="form-label" for="fSubject" data-i18n="f_subject"></label>
            <input class="form-control" id="fSubject" name="subject" type="text" maxlength="120">
          </div>
          <div class="col-12">
            <label class="form-label" for="fMsg" data-i18n="f_msg"></label>
            <textarea class="form-control" id="fMsg" name="message" rows="5" required maxlength="3000"></textarea>
            <div class="invalid-feedback" data-i18n="f_req"></div>
          </div>
          <div class="col-12 d-flex flex-wrap align-items-center gap-3">
            <button class="btn-x btn-royal" type="submit" id="fBtn"><i class="bi bi-send"></i> <span data-i18n="f_send"></span></button>
            <div class="form-status" id="fStatus" role="status" aria-live="polite"></div>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>

<footer class="foot">
  <div class="container">
    <div class="foot-top">
      <div><strong id="footName"></strong><p id="footTag"></p></div>
      <div class="foot-icons" id="footIcons"></div>
    </div>
    <div class="foot-bottom"><span id="footerText"></span><a href="#home"><i class="bi bi-arrow-up"></i> <span data-i18n="to_top"></span></a></div>
  </div>
</footer>

<a href="#home" class="fab" id="fab" aria-label="Back to top"><i class="bi bi-arrow-up"></i></a>

<!-- نافذة تفاصيل المشروع -->
<div class="modal fade" id="projModal" tabindex="-1" aria-labelledby="pmTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content pm">
      <div class="modal-header"><h2 class="modal-title" id="pmTitle"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body" id="pmBody"></div>
      <div class="modal-footer" id="pmFoot"></div>
    </div>
  </div>
</div>

<!-- معاينة صورة الشهادة -->
<div class="modal fade" id="imgModal" tabindex="-1" aria-label="Preview" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content pm"><div class="modal-header border-0"><span id="imgCap" class="fw-bold"></span><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body text-center pt-0"><img id="imgBig" alt="" class="img-fluid rounded-3"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
